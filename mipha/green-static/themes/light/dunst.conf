    format = "<span foreground='#006b46'><b>%s</b></span>\n<span foreground='#14251f'>%b</span>"

[urgency_low]
    background = "#f3f6f4"
    foreground = "#405b50"
    frame_color = "#9eafa7"
    highlight = "#006b46"
    timeout = 4

[urgency_normal]
    background = "#ffffff"
    foreground = "#14251f"
    frame_color = "#006b4680"
    highlight = "#006b46"
    timeout = 7

[urgency_critical]
    background = "#fff7f7"
    foreground = "#701f24"
    frame_color = "#a92d32b0"
    highlight = "#a92d32"
    timeout = 0
