    format = "<span foreground='#006b46'><b>%s</b></span>\n<span foreground='#3f3024'>%b</span>"

[urgency_low]
    background = "#f0e6d2"
    foreground = "#715b43"
    frame_color = "#baa17d"
    highlight = "#006b46"
    timeout = 4

[urgency_normal]
    background = "#f7eedc"
    foreground = "#3f3024"
    frame_color = "#006b4680"
    highlight = "#006b46"
    timeout = 7

[urgency_critical]
    background = "#fff7f7"
    foreground = "#701f24"
    frame_color = "#a92d32b0"
    highlight = "#a92d32"
    timeout = 0
